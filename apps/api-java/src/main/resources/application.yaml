server:
  port: ${PORT:3000}
  servlet:
    context-path: /api

spring:
  application:
    name: erp-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/erp_java}
    username: ${POSTGRES_USER:erp}
    password: ${POSTGRES_PASSWORD:erp}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /openapi
  swagger-ui:
    path: /docs
